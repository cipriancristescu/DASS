{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Seteaza parola noua</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="form-group">
                <label>Parola noua</label>
                <input type="password" name="password"
                       placeholder="Minim 8 caractere" required>
                <small style="color:#888; font-size:0.8rem; margin-top:4px; display:block;">
                    Minim 8 caractere &bull; cel putin o litera mare &bull; cel putin o cifra
                </small>
            </div>
            <button type="submit" class="btn">Seteaza parola</button>
        </form>
    </div>
</div>
{% endblock %}
