{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Inregistrare cont</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <label>Parola</label>
                <input type="password" name="password" placeholder="Minim 8 caractere" required>
                <small style="color:#888; font-size:0.8rem; margin-top:4px; display:block;">
                    Minim 8 caractere &bull; cel putin o litera mare &bull; cel putin o cifra
                </small>
            </div>
            <button type="submit" class="btn">Creeaza cont</button>
        </form>

        <div class="links">
            Ai deja cont? <a href="{{ url_for('login') }}">Autentifica-te</a>
        </div>
    </div>
</div>
{% endblock %}
