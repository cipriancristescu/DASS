{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Autentificare</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <label>Parola</label>
                <input type="password" name="password" placeholder="parola" required>
            </div>
            <button type="submit" class="btn">Autentifica-te</button>
        </form>

        <div class="links">
            <a href="{{ url_for('forgot_password') }}">Ai uitat parola?</a>
            &nbsp;|&nbsp;
            <a href="{{ url_for('register') }}">Creeaza cont</a>
        </div>
    </div>
</div>
{% endblock %}
