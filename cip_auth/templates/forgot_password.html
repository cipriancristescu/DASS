{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Resetare parola</h2>

        {% if message %}
        <div class="alert alert-success">
            {{ message }}<br>
            <!--
                VULNERABILITATE #6a: Token predictibil (timestamp Unix).
                Observati ca tokenul din link este un numar simplu de 10 cifre.
                Un atacator poate genera toate valorile posibile pentru un
                interval de timp si incerca resetarea pentru orice cont.
            -->
            <a class="reset-link" href="{{ link }}">{{ link }}</a>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="email-ul contului" required>
            </div>
            <button type="submit" class="btn">Genereaza link de resetare</button>
        </form>

        <div class="links">
            <a href="{{ url_for('login') }}">Inapoi la login</a>
        </div>
    </div>
</div>
{% endblock %}
