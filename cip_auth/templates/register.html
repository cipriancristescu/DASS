{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Inregistrare cont</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <!--
            VULNERABILITATE #1: Nu exista nicio validare a parolei in backend.
            Sunt acceptate parole extrem de slabe (ex: "1", "a", "123").
        -->
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <label>Parola</label>
                <!-- Nicio restrictie: minlength, pattern, required complex -->
                <input type="password" name="password" placeholder="orice parola...">
            </div>
            <button type="submit" class="btn">Creeaza cont</button>
        </form>

        <div class="links">
            Ai deja cont? <a href="{{ url_for('login') }}">Autentifica-te</a>
        </div>
    </div>
</div>
{% endblock %}
