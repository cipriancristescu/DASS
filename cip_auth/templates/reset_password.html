{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Seteaza parola noua</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <!--
            VULNERABILITATE #6c+d: Token fara expirare si reutilizabil.
            Dupa ce setati parola, tokenul din URL ramane valid.
            Puteti refolosi acelasi URL pentru a schimba parola din nou.
        -->
        <div class="alert alert-success" style="margin-bottom:18px; font-size:0.82rem;">
            Token activ: <code style="color:#5ce08e;">{{ token }}</code><br>
            <span style="color:#888;">Observati ca acest token nu expira si poate fi reutilizat.</span>
        </div>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="form-group">
                <label>Parola noua</label>
                <!-- VULNERABILITATE #1: Nicio validare a noii parole -->
                <input type="password" name="password" placeholder="parola noua (orice)">
            </div>
            <button type="submit" class="btn">Seteaza parola</button>
        </form>
    </div>
</div>
{% endblock %}
